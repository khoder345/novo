name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip NOVO_v4_project.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: cd novo && npm install
      - run: cd novo && cp node_modules/three/build/three.module.js www/three.module.js
      - run: cd novo && npx cap add android && npx cap sync android
      - run: cd novo/android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NOVO-apk
          path: novo/android/app/build/outputs/apk/debug/app-debug.apk
